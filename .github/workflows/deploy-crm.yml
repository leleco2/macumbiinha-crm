name: Publicar Macumbiinha CRM na Cloudflare Workers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-crm.yml"
      - "public/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "wrangler.jsonc"

permissions:
  contents: read

concurrency:
  group: crm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar e publicar CRM
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testar código e regras de negócio
        run: |
          npm run check
          python3 -m unittest tests/test_database.py

      - name: Verificar credencial da Cloudflare
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_DEPLOY_TOKEN" ]; then
            echo "::error::Configure o secret CLOUDFLARE_API_TOKEN em Settings > Secrets and variables > Actions do repositório. Não envie o token em mensagens."
            exit 1
          fi

      - name: Instalar driver para teste funcional em navegador
        run: npm install --no-audit --no-fund --no-save playwright-core

      - name: Testar menus, login, formulários e ações no Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/browser-functional.mjs

      - name: Gerar favicon e ícones PWA atualizados
        run: npm run build:icons

      - name: Publicar Worker e arquivos PWA (sem alterar o D1)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "0c4c6e226af971ccaf0490eff6b90d60"
          command: deploy

      - name: Verificar deploy público
        env:
          BASE_URL: https://macumbiinha-crm.maodeouro-nexa.workers.dev
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error "$BASE_URL/api/health" | jq -e '.ok == true and .service == "Macumbiinha CRM"' >/dev/null \
              && curl --fail --silent --show-error "$BASE_URL/" | grep -F "Macumbiinha — Gestão e Operação" >/dev/null \
              && curl --fail --silent --show-error "$BASE_URL/app.js" | grep -F "const queryRoot=" >/dev/null \
              && curl --fail --silent --show-error "$BASE_URL/refined.css" | grep -F "Design system v2" >/dev/null; then
              break
            fi
            if [ "$attempt" = 8 ]; then
              echo "::error::CRM não atualizou os arquivos esperados na CDN da Cloudflare."
              exit 1
            fi
            sleep 8
          done
          curl --fail --silent --show-error "$BASE_URL/" | grep -F "Macumbiinha — Gestão e Operação"
          curl --fail --silent --show-error "$BASE_URL/finance-analytics.js" | grep -F "Read-only visualizations"
          curl --fail --silent --show-error "$BASE_URL/experience.js" | grep -F "install"
          curl --fail --silent --show-error "$BASE_URL/refined.css" | grep -F "Design system v2"
          curl --fail --silent --show-error "$BASE_URL/interface.js" | grep -F "client-side navigation palette"
          curl --fail --silent --show-error "$BASE_URL/icon.svg" | grep -F "#18392A"
          curl --fail --silent --show-error "$BASE_URL/api/public/catalog" | jq -e '.source == "macumbiinha-crm" and (.items | type == "array" and length >= 34)'
          curl --fail --silent --show-error "$BASE_URL/api/public/site" | jq -e '(.settings.whatsapp | type == "string")'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$BASE_URL/api/dashboard")" = "401"
