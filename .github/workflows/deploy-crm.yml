name: Publicar Macumbiinha CRM na Cloudflare Workers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-crm.yml"

permissions:
  contents: read

concurrency:
  group: crm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar e publicar CRM
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testar código e regras de negócio
        run: |
          npm run check
          python3 -m unittest tests/test_database.py

      - name: Verificar credencial da Cloudflare
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_DEPLOY_TOKEN" ]; then
            echo "::error::Configure o secret CLOUDFLARE_API_TOKEN em Settings > Secrets and variables > Actions do repositório. Não envie o token em mensagens."
            exit 1
          fi

      - name: Publicar Worker e arquivos PWA (sem alterar o D1)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "0c4c6e226af971ccaf0490eff6b90d60"
          command: deploy

      - name: Verificar deploy público
        env:
          BASE_URL: https://macumbiinha-crm.maodeouro-nexa.workers.dev
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$BASE_URL/api/health" | jq -e '.ok == true and .service == "Macumbiinha CRM"' >/dev/null; then
              break
            fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 8
          done
          curl --fail --silent --show-error "$BASE_URL/" | grep -F "Macumbiinha | CRM & ERP"
          curl --fail --silent --show-error "$BASE_URL/finance-analytics.js" | grep -F "finance"
          curl --fail --silent --show-error "$BASE_URL/experience.js" | grep -F "install"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$BASE_URL/api/dashboard")" = "401"
